services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finpilot_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-finpilot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finpilot} -d ${POSTGRES_DB:-finpilot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finpilot-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: finpilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finpilot}:${POSTGRES_PASSWORD:-finpilot_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-finpilot_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-finpilot}:${POSTGRES_PASSWORD:-finpilot_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-finpilot_db}
      SECRET_KEY: ${SECRET_KEY:-dev_insecure_jwt_secret_key_change_in_production_1234567890}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      # Phase 4 optional LangSmith tracing
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-finpilot-ai}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    networks:
      - finpilot-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: finpilot-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - finpilot-network

volumes:
  postgres_data:

networks:
  finpilot-network:
    driver: bridge
